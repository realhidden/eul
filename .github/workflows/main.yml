name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  Build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/cache@v4
        with:
          path: BuildTools/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('BuildTools/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      - name: Install xcbeautify
        run: brew install xcbeautify
      - name: SwiftFormat (lint)
        run: swift run -c release swiftformat .. --lint
        working-directory: ./BuildTools
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -scheme eul -project ./eul.xcodeproj build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO" | xcbeautify
