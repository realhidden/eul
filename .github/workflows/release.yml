name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Ubuntu 20.04's glibc 2.31 runs on Debian 11+, Ubuntu 20.04+ and Raspberry
  # Pi OS bullseye+ (Debian 11's own archive is gone since its LTS ended);
  # dynamic on purpose so NVIDIA's NVML can be loaded at runtime
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - name: Build and test on glibc 2.31
        run: |
          docker run --rm --platform ${{ matrix.platform }} -v "$PWD/linux:/src" -w /src ubuntu:20.04 sh -c '
            export DEBIAN_FRONTEND=noninteractive &&
            apt-get update -qq && apt-get install -y -qq gcc make file >/dev/null &&
            make clean && make CFLAGS="-O2 -Werror" && make test &&
            ./eul --json > /dev/null && file ./eul'

      - name: Package
        run: |
          mkdir -p "dist/eul-linux-${{ matrix.arch }}"
          cp linux/eul linux/README.md linux/eul-cli.service "dist/eul-linux-${{ matrix.arch }}/"
          tar -C dist -czf "eul-linux-${{ matrix.arch }}.tar.gz" "eul-linux-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: eul-linux-${{ matrix.arch }}
          path: eul-linux-${{ matrix.arch }}.tar.gz

  release:
    needs: linux
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: SwiftFormat lint
        run: swift run -c release swiftformat ../ --lint
        working-directory: ./BuildTools

      # ENABLE_HARDENED_RUNTIME must be NO for an ad-hoc signed artifact.
      # Hardened runtime turns on library validation, which requires the
      # embedded SharedLibrary.framework to share a Team ID with the host —
      # ad-hoc signatures have none, so dyld aborts before any app code runs:
      #   Library not loaded: @rpath/SharedLibrary.framework/.../SharedLibrary
      #   Reason: ... different Team IDs
      # Xcode's own debug runs mask this; a downloaded .app does not.
      - name: Build
        run: |
          xcodebuild -scheme eul -project ./eul.xcodeproj -sdk macosx \
            -configuration Release build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_ALLOWED="NO" \
            ENABLE_HARDENED_RUNTIME="NO" \
            ONLY_ACTIVE_ARCH="NO" ARCHS="x86_64 arm64" \
            -derivedDataPath ./build

      - name: Ad-hoc sign
        run: |
          APP="./build/Build/Products/Release/eul.app"
          codesign --force --deep --sign - "$APP"
          # fail the release rather than publish an app that cannot launch
          codesign --verify --deep --strict --verbose=2 "$APP"
          if codesign -d --verbose=2 "$APP" 2>&1 | grep -q "runtime"; then
            echo "::error::hardened runtime is set on an ad-hoc signed build; it will not launch"
            exit 1
          fi
          # the README promises Apple Silicon + Intel; a Debug/active-arch
          # build silently ships arm64 only
          lipo -info "$APP/Contents/MacOS/eul"
          for arch in x86_64 arm64; do
            lipo -info "$APP/Contents/MacOS/eul" | grep -q "$arch" || {
              echo "::error::release binary is missing $arch"; exit 1; }
          done

      - name: Package
        run: |
          cd ./build/Build/Products/Release
          zip -r -y "$GITHUB_WORKSPACE/eul.app.zip" eul.app

      - uses: actions/download-artifact@v4
        with:
          pattern: eul-linux-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            eul.app.zip
            eul-linux-*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
